<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rule 110 Cellular Automata</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>Rule 110 Cellular Automata</h1>
      <p class="subtitle">1D automata evolved over time and drawn row by row.</p>

      <section class="controls">
        <label>
          Width (cells)
          <input id="width" type="number" min="32" max="1024" step="1" value="256" />
        </label>
        <label>
          Steps (rows)
          <input id="steps" type="number" min="32" max="2048" step="1" value="256" />
        </label>
        <label>
          Cell size (px)
          <input id="cellSize" type="number" min="1" max="8" step="1" value="2" />
        </label>
        <label>
          Seed
          <select id="seed">
            <option value="single">Single rightmost cell</option>
            <option value="random">Random</option>
          </select>
        </label>
        <button id="drawBtn" type="button">Draw</button>
      </section>

      <canvas id="canvas" width="512" height="512" aria-label="Rule 110 canvas"></canvas>
    </main>

    <script src="app.js"></script>
  </body>
</html>
